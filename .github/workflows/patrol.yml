name: patrol
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
concurrency: patrol
jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix test
      - run: node tools/patrol.mjs
        env:
          BACKEDBY_PATROL_KEY: ${{ secrets.BACKEDBY_PATROL_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patrol-last
          path: docs/patrol-last.json
